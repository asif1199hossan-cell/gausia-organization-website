<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel Link | Gausia Committee</title><link rel="stylesheet" href="css/style.css"><style>.launch{max-width:650px;margin:70px auto;padding:28px;background:#fff;border:1px solid #e1e9e3;border-radius:16px;text-align:center}.launch input{width:100%;padding:12px;border:1px solid #ccd8cf;border-radius:8px;margin:10px 0 14px}.launch button{border:0;border-radius:8px;padding:12px 18px;background:#17613d;color:#fff;font-weight:bold;cursor:pointer}.muted{color:#66756b;font-size:14px}</style></head><body><main class="launch"><h1>ওয়েবসাইট Admin Panel</h1><p>প্রথমে Apps Script Web App URL সংরক্ষণ করুন। এরপর নিরাপদ Admin Panel খুলুন।</p><input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec"><button id="save">URL সংরক্ষণ</button> <button id="open">Admin Panel খুলুন</button><p class="muted">URL এই ব্রাউজারে সংরক্ষিত থাকবে। Username ও Password Apps Script-এর নিরাপদ লগইন পেজে দিতে হবে।</p><p><a href="index.html">← ওয়েবসাইটে ফিরে যান</a></p><p id="msg" class="muted"></p></main><script>const k='gausia_admin_api',u=document.getElementById('url'),m=document.getElementById('msg');u.value=localStorage.getItem(k)||'';document.getElementById('save').onclick=()=>{localStorage.setItem(k,u.value.trim());m.textContent='URL সংরক্ষণ হয়েছে।'};document.getElementById('open').onclick=()=>{const v=u.value.trim()||localStorage.getItem(k);if(!v){m.textContent='আগে Apps Script URL দিন।';return}localStorage.setItem(k,v);location.href=v+(v.includes('?')?'&':'?')+'view=admin';};</script></body></html>
